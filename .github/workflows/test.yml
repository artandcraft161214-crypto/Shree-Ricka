name: ReelToTube Processor

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram Reel URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW INPUT
      # ============================================================
      - name: Show Reel URL
        run: |
          echo "=========================================="
          echo "        ReelToTube Processor"
          echo "=========================================="
          echo ""
          echo "Instagram URL:"
          echo "${{ inputs.instagram_url }}"
          echo ""
          echo "=========================================="


      # ============================================================
      # 3. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 3

          echo ""
          echo "FFprobe:"
          ffprobe -version | head -n 3


      # ============================================================
      # 4. CHECK PYTHON
      # ============================================================
      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version


      # ============================================================
      # 5. INSTALL YT-DLP
      # ============================================================
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp
          yt-dlp --version


      # ============================================================
      # 6. DOWNLOAD INSTAGRAM REEL
      # ============================================================
      - name: Download Instagram Reel
        run: |

          mkdir -p output

          echo "=========================================="
          echo "       DOWNLOADING INSTAGRAM REEL"
          echo "=========================================="

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -o "output/reel.%(ext)s" \
            "${{ inputs.instagram_url }}"

          echo ""
          echo "Download completed."

          ls -lh output/


      # ============================================================
      # 7. CHECK VIDEO
      # ============================================================
      - name: Check downloaded video
        run: |

          echo "=========================================="
          echo "       DOWNLOADED VIDEO INFORMATION"
          echo "=========================================="

          ls -lh output/

          if [ ! -f "output/reel.mp4" ]; then
            echo "ERROR: output/reel.mp4 was not found."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/reel.mp4


      # ============================================================
      # 8. INSTALL VIDEO ANALYSIS TOOLS
      # ============================================================
      - name: Install video analysis tools
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            opencv-python-headless \
            numpy \
            Pillow \
            ImageHash \
            requests \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ============================================================
      # 9. FIND BEST SECTION
      # ============================================================
      - name: Find best section
        run: |

          cat > analyze_video.py <<'PY'

          import cv2
          import numpy as np


          VIDEO = "output/reel.mp4"


          cap = cv2.VideoCapture(VIDEO)


          fps = cap.get(
              cv2.CAP_PROP_FPS
          )

          frame_count = int(
              cap.get(
                  cv2.CAP_PROP_FRAME_COUNT
              )
          )


          if fps <= 0:
              fps = 30


          duration = (
              frame_count / fps
          )


          print("==========================================")
          print("             VIDEO ANALYSIS")
          print("==========================================")
          print(f"FPS: {fps}")
          print(f"Frames: {frame_count}")
          print(f"Duration: {duration:.2f} seconds")


          # Maximum Short length
          short_length = min(
              30.0,
              duration
          )


          # If video is shorter than 30 seconds,
          # simply start from zero.

          if duration <= 30:

              best_start = 0.0

          else:

              scores = []

              previous = None

              second = 0


              while second < duration:

                  cap.set(
                      cv2.CAP_PROP_POS_MSEC,
                      second * 1000
                  )


                  ret, frame = cap.read()


                  if not ret:
                      break


                  frame = cv2.resize(
                      frame,
                      (320, 180)
                  )


                  gray = cv2.cvtColor(
                      frame,
                      cv2.COLOR_BGR2GRAY
                  )


                  if previous is not None:

                      difference = cv2.absdiff(
                          gray,
                          previous
                      )


                      score = float(
                          np.mean(difference)
                      )


                      scores.append(
                          (
                              second,
                              score
                          )
                      )


                  previous = gray

                  second += 1


              cap.release()


              if not scores:

                  best_start = 0.0

              else:

                  window = int(
                      short_length
                  )

                  best_start = 0

                  best_score = -1


                  for start in range(
                      0,
                      max(
                          1,
                          int(duration)
                      )
                  ):

                      end = (
                          start
                          + window
                      )


                      total = sum(
                          score
                          for timestamp, score
                          in scores
                          if (
                              start
                              <= timestamp
                              < end
                          )
                      )


                      if total > best_score:

                          best_score = total

                          best_start = start


                  # Do not exceed duration.

                  if (
                      best_start
                      + short_length
                      > duration
                  ):

                      best_start = max(
                          0,
                          duration
                          - short_length
                      )


          print("")
          print("==========================================")
          print("           BEST SECTION FOUND")
          print("==========================================")

          print(
              f"Start: {best_start:.2f} seconds"
          )

          print(
              f"Length: {short_length:.2f} seconds"
          )


          with open(
              "best_section.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(best_start)
              )


          print("==========================================")

          PY


          python3 analyze_video.py


      # ============================================================
      # 10. CREATE YOUTUBE SHORT
      # ============================================================
      - name: Create YouTube Short
        run: |

          START=$(cat best_section.txt)


          echo "=========================================="
          echo "        CREATING YOUTUBE SHORT"
          echo "=========================================="

          echo "Start position:"
          echo "${START}s"


          ffmpeg \
            -y \
            -ss "${START}" \
            -i output/reel.mp4 \
            -t 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -movflags +faststart \
            output/youtube_short.mp4


          echo ""
          echo "YouTube Short created."

          ls -lh output/


      # ============================================================
      # 11. CHECK SHORT
      # ============================================================
      - name: Check final Short
        run: |

          echo "=========================================="
          echo "         FINAL SHORT INFORMATION"
          echo "=========================================="


          if [ ! -f "output/youtube_short.mp4" ]; then

            echo "ERROR:"
            echo "youtube_short.mp4 was not created."

            exit 1

          fi


          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            output/youtube_short.mp4


      # ============================================================
      # 12. INSTALL GEMINI SDK
      # ============================================================
      - name: Install Gemini SDK
        run: |

          python3 -m pip install --upgrade google-genai


      # =========================================================
      # 11. GEMINI ANALYSIS
      # =========================================================
      - name: Analyze Short with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          cat > gemini_analysis.py <<'PY'

          import os
          import json
          import time
          import re

          from google import genai


          API_KEY = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not API_KEY:
              raise RuntimeError(
                  "GEMINI_API_KEY is not configured."
              )


          client = genai.Client(
              api_key=API_KEY
          )


          VIDEO_PATH = "output/youtube_short.mp4"


          print("========================================")
          print("GEMINI VIDEO ANALYSIS")
          print("========================================")


          video_file = client.files.upload(
              file=VIDEO_PATH
          )


          print(
              f"Uploaded: {video_file.name}"
          )


          while True:

              video_file = client.files.get(
                  name=video_file.name
              )

              state = (
                  video_file.state.name
                  if video_file.state
                  else "UNKNOWN"
              )

              print(
                  f"Gemini state: {state}"
              )

              if state == "ACTIVE":
                  break

              if state == "FAILED":
                  raise RuntimeError(
                      "Gemini failed to process video."
                  )

              time.sleep(5)


          prompt = r"""
          Analyze this YouTube Short carefully.

          You are an expert YouTube Shorts SEO strategist.

          Identify ONLY information that can reasonably be
          inferred from the video/audio.

          NEVER invent:
          - song names
          - artists
          - celebrities
          - locations
          - brands
          - events
          - facts

          If a song cannot be confidently identified,
          leave song_name and artist empty.

          Return ONLY valid JSON.

          Structure:

          {
            "title": "",
            "description": "",
            "tags": "",
            "hashtags": "",
            "song_name": "",
            "artist": "",
            "best_moment": "",
            "category": "",
            "keywords": ""
          }

          TITLE:

          - One title only.
          - Approximately 45-80 characters.
          - Must end with #Shorts.
          - No other hashtags.
          - Natural and clickable.
          - Accurate.
          - Mention song only if confidently identified.

          DESCRIPTION:

          - 2-4 natural sentences.
          - Describe what is actually shown.
          - Include relevant search terms naturally.
          - Include engagement CTA.
          - No hashtag block.

          HASHTAGS:

          - 8-12 hashtags.
          - Must include #Shorts.
          - Must include #YouTubeShorts.
          - Relevant to actual content.
          - Song hashtag only when song is known.
          - No unrelated viral hashtags.
          - Space-separated.

          TAGS:

          - 350-490 characters.
          - Comma-separated.
          - No hashtags.
          - No URLs.
          - Search-intent focused.
          - No duplicate tags.

          BEST MOMENT:

          Give approximate timestamp and explain the strongest hook.

          CATEGORY:

          Choose one:
          Entertainment
          Music
          People & Blogs
          Comedy
          Sports
          Howto & Style
          Education

          KEYWORDS:

          15-25 relevant keywords.
          Comma-separated.

          FINAL CHECK:

          - title ends with #Shorts
          - hashtags count 8-12
          - #Shorts exists
          - #YouTubeShorts exists
          - no invented song
          - no invented artist
          - tags under 490 characters
          - valid JSON only
          """


          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=[
                  video_file,
                  prompt
              ]
          )


          text = response.text.strip()


          # Remove markdown JSON fences if Gemini adds them.
          text = re.sub(
              r"^```json\s*",
              "",
              text,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r"^```\s*",
              "",
              text
          )

          text = re.sub(
              r"\s*```$",
              "",
              text
          )


          data = json.loads(text)


          required = [
              "title",
              "description",
              "tags",
              "hashtags",
              "song_name",
              "artist",
              "best_moment",
              "category",
              "keywords"
          ]


          for key in required:

              if key not in data:
                  data[key] = ""


          # Clean title
          title = str(
              data["title"]
          ).strip()

          title = re.sub(
              r"\s+#Shorts\s*$",
              "",
              title,
              flags=re.IGNORECASE
          )

          title = (
              title
              + " #Shorts"
          )


          data["title"] = title


          # Clean hashtags
          hashtags = str(
              data["hashtags"]
          ).split()


          cleaned_hashtags = []

          for tag in hashtags:

              tag = tag.strip()

              if not tag:
                  continue

              if not tag.startswith("#"):
                  tag = "#" + tag

              if tag.lower() not in [
                  x.lower()
                  for x in cleaned_hashtags
              ]:

                  cleaned_hashtags.append(tag)


          required_hashtags = [
              "#Shorts",
              "#YouTubeShorts"
          ]


          for tag in required_hashtags:

              if tag.lower() not in [
                  x.lower()
                  for x in cleaned_hashtags
              ]:

                  cleaned_hashtags.append(tag)


          cleaned_hashtags = cleaned_hashtags[:12]


          data["hashtags"] = " ".join(
              cleaned_hashtags
          )


          # Clean tags and enforce max 490 chars.
          raw_tags = str(
              data["tags"]
          )

          tags = []

          for tag in raw_tags.split(","):

              tag = tag.strip()

              if not tag:
                  continue

              tag = tag.replace("#", "")

              if tag.lower() not in [
                  x.lower()
                  for x in tags
              ]:

                  tags.append(tag)


          final_tags = []

          current_length = 0

          for tag in tags:

              addition = (
                  len(tag)
                  if not final_tags
                  else len(tag) + 2
              )

              if current_length + addition > 490:
                  break

              final_tags.append(tag)

              current_length += addition


          data["tags"] = ", ".join(
              final_tags
          )


          # Clean keywords
          keywords = []

          for keyword in str(
              data["keywords"]
          ).split(","):

              keyword = keyword.strip()

              if not keyword:
                  continue

              if keyword.lower() not in [
                  x.lower()
                  for x in keywords
              ]:

                  keywords.append(keyword)


          data["keywords"] = ", ".join(
              keywords[:25]
          )


          with open(
              "metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("========================================")
          print("GENERATED METADATA")
          print("========================================")

          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY

          python3 gemini_analysis.py


      # =========================================================
      # 12. CHECK YOUTUBE DUPLICATE
      # =========================================================
      - name: Check YouTube for duplicate
        id: duplicate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |

          cat > youtube_duplicate_check.py <<'PY'

          import os
          import json
          import re
          import sys
          import subprocess
          import tempfile
          import shutil
          from difflib import SequenceMatcher

          import cv2
          import imagehash

          from PIL import Image
          import requests

          from googleapiclient.discovery import build


          API_KEY = os.environ.get(
              "YOUTUBE_API_KEY"
          )


          if not API_KEY:

              print(
                  "ERROR: YOUTUBE_API_KEY GitHub Secret is missing."
              )

              sys.exit(1)


          METADATA_FILE = "metadata.json"
          VIDEO_FILE = "output/youtube_short.mp4"


          with open(
              METADATA_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          title = str(
              metadata.get("title", "")
          ).strip()

          description = str(
              metadata.get("description", "")
          ).strip()

          song_name = str(
              metadata.get("song_name", "")
          ).strip()

          artist = str(
              metadata.get("artist", "")
          ).strip()

          keywords = [
              x.strip()
              for x in str(
                  metadata.get("keywords", "")
              ).split(",")
              if x.strip()
          ]


          print("========================================")
          print("YOUTUBE DUPLICATE CHECK")
          print("========================================")

          print("Title:")
          print(title)

          print()
          print("Song:")
          print(song_name)

          print()
          print("Artist:")
          print(artist)


          # =====================================================
          # SOURCE VIDEO INFORMATION
          # =====================================================

          cap = cv2.VideoCapture(
              VIDEO_FILE
          )

          fps = float(
              cap.get(cv2.CAP_PROP_FPS)
          )

          frame_count = int(
              cap.get(cv2.CAP_PROP_FRAME_COUNT)
          )

          duration = (
              float(frame_count) / fps
              if fps > 0
              else 0.0
          )

          width = int(
              cap.get(cv2.CAP_PROP_FRAME_WIDTH)
          )

          height = int(
              cap.get(cv2.CAP_PROP_FRAME_HEIGHT)
          )

          cap.release()


          # =====================================================
          # PHASH SOURCE FRAMES
          # =====================================================

          def get_video_hashes(
              video_path
          ):

              cap = cv2.VideoCapture(
                  video_path
              )

              fps = float(
                  cap.get(
                      cv2.CAP_PROP_FPS
                  )
              )

              frames = int(
                  cap.get(
                      cv2.CAP_PROP_FRAME_COUNT
                  )
              )

              if fps <= 0 or frames <= 0:

                  cap.release()

                  return []


              duration = (
                  frames / fps
              )


              positions = [
                  0.05,
                  0.15,
                  0.25,
                  0.35,
                  0.50,
                  0.65,
                  0.75,
                  0.85,
                  0.95
              ]

              hashes = []


              for position in positions:

                  timestamp = (
                      duration * position
                  )

                  cap.set(
                      cv2.CAP_PROP_POS_MSEC,
                      timestamp * 1000
                  )

                  ret, frame = cap.read()

                  if not ret:
                      continue


                  frame = cv2.cvtColor(
                      frame,
                      cv2.COLOR_BGR2RGB
                  )

                  image = Image.fromarray(
                      frame
                  )

                  hashes.append(
                      imagehash.phash(
                          image
                      )
                  )


              cap.release()

              return hashes


          source_hashes = get_video_hashes(
              VIDEO_FILE
          )


          print()
          print(
              f"Source duration: {duration:.2f}s"
          )

          print(
              f"Source resolution: {width}x{height}"
          )

          print(
              f"Source frame hashes: {len(source_hashes)}"
          )


          # =====================================================
          # YOUTUBE API
          # =====================================================

          youtube = build(
              "youtube",
              "v3",
              developerKey=API_KEY
          )


          # =====================================================
          # BUILD SEARCH QUERIES
          # =====================================================

          # Normalize text BEFORE any query construction uses it.
          # This fixes the previous NameError where normalize() was
          # defined later in the script but called here first.
          def normalize(text):

              text = str(text).lower()

              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9\u0900-\u097f ]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          queries = []


          def add_query(q):

              q = re.sub(
                  r"\s+",
                  " ",
                  str(q)
              ).strip()

              if len(q) < 3:
                  return

              if q.lower() not in [
                  x.lower()
                  for x in queries
              ]:

                  queries.append(q[:95])


          # Exact title without Shorts hashtag.
          title_query = re.sub(
              r"#Shorts\b",
              "",
              title,
              flags=re.IGNORECASE
          ).strip()

          add_query(title_query)


          # Song + artist.
          if song_name and artist:

              add_query(
                  f"{song_name} {artist}"
              )


          # Song only.
          if song_name:

              add_query(
                  song_name
              )

              add_query(
                  f"{song_name} dance"
              )


          # Title + dance.
          add_query(
              f"{title_query} dance"
          )


          # First relevant keywords.
          for keyword in keywords[:8]:

              add_query(keyword)


          # Broader combinations to improve platform-wide search coverage.
          # The YouTube Data API cannot literally enumerate every video on YouTube,
          # so we use multiple independent relevance searches.
          if song_name and not artist:
              add_query(f"{song_name} shorts")

          if title_query:
              title_words = [
                  w for w in normalize(title_query).split()
                  if len(w) >= 3
              ]
              if len(title_words) >= 2:
                  add_query(" ".join(title_words[:6]))

          if keywords:
              add_query(" ".join(keywords[:3]))

          # Extra combinations improve discovery when YouTube uses a
          # completely different title from the Instagram reel.
          if song_name and keywords:
              add_query(f"{song_name} {' '.join(keywords[:2])}")

          if artist and keywords:
              add_query(f"{artist} {' '.join(keywords[:3])}")

          # Search using meaningful title words rather than relying only on
          # Gemini's generated title.
          if title_query:
              words = [
                  w for w in normalize(title_query).split()
                  if len(w) >= 4
              ]
              if len(words) >= 3:
                  add_query(" ".join(words[:3]))
                  add_query(" ".join(words[-3:]))

          print()
          print("Search queries:")

          for query in queries:

              print(
                  f"- {query}"
              )


          # =====================================================
          # SEARCH YOUTUBE
          # =====================================================

          candidates = {}

          # YouTube search is paginated. Search two relevance pages per query
          # so a repost with different metadata is less likely to be missed.
          MAX_PAGES_PER_QUERY = 2

          for query in queries:

              page_token = None

              for page_number in range(MAX_PAGES_PER_QUERY):
                  try:
                      request_kwargs = {
                          "part": "snippet",
                          "q": query,
                          "type": "video",
                          "videoDuration": "short",
                          "order": "relevance",
                          "maxResults": 50
                      }

                      if page_token:
                          request_kwargs["pageToken"] = page_token

                      response = youtube.search().list(
                          **request_kwargs
                      ).execute()

                  except Exception as e:
                      print(
                          f"Search failed for '{query}' page {page_number + 1}: {e}"
                      )
                      break

                  for item in response.get(
                      "items",
                      []
                  ):
                      video_id = (
                          item
                          .get("id", {})
                          .get("videoId")
                      )

                      if not video_id:
                          continue

                      snippet = item.get(
                          "snippet",
                          {}
                      )

                      candidates[video_id] = {
                          "video_id": video_id,
                          "title": str(snippet.get("title", "")),
                          "description": str(snippet.get("description", "")),
                          "channel_title": str(snippet.get("channelTitle", "")),
                          "published_at": str(snippet.get("publishedAt", "")),
                          "thumbnail": str(
                              snippet.get("thumbnails", {})
                              .get("high", {})
                              .get("url", "")
                          )
                      }

                  page_token = response.get("nextPageToken")
                  if not page_token:
                      break


          print()
          print(
              f"Unique YouTube candidates found: {len(candidates)}"
          )
          print("Coverage: multiple independent YouTube searches across title, song, keywords and combinations.")
          print("Note: YouTube Data API search cannot guarantee enumeration of every video on the platform.")


          # =====================================================
          # FETCH VIDEO DURATIONS
          # =====================================================
          # Duration is a supporting signal: exact reposts normally have
          # nearly the same duration even when metadata is completely different.
          def parse_iso_duration(value):
              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  str(value or "")
              )
              if not match:
                  return 0.0
              return (
                  float(match.group(1) or 0) * 3600
                  + float(match.group(2) or 0) * 60
                  + float(match.group(3) or 0)
              )

          candidate_ids = list(candidates.keys())
          for offset in range(0, len(candidate_ids), 50):
              batch = candidate_ids[offset:offset + 50]
              try:
                  details = youtube.videos().list(
                      part="contentDetails",
                      id=",".join(batch)
                  ).execute()
                  for item in details.get("items", []):
                      vid = str(item.get("id", ""))
                      if vid in candidates:
                          candidates[vid]["duration"] = parse_iso_duration(
                              item.get("contentDetails", {}).get("duration", "")
                          )
              except Exception as e:
                  print(f"Duration lookup warning: {e}")

          for candidate in candidates.values():
              candidate.setdefault("duration", 0.0)


          # =====================================================
          # TEXT SIMILARITY
          # =====================================================

          normalized_source_title = normalize(
              title_query
          )

          source_words = set(
              normalized_source_title.split()
          )


          def text_similarity(
              a,
              b
          ):

              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0.0


              sequence_score = (
                  SequenceMatcher(
                      None,
                      a,
                      b
                  ).ratio()
              )


              b_words = set(
                  b.split()
              )


              if source_words:

                  overlap = len(
                      source_words
                      & b_words
                  ) / max(
                      1,
                      len(source_words)
                  )

              else:

                  overlap = 0.0


              return float(
                  max(
                      sequence_score,
                      overlap
                  )
              )


          # =====================================================
          # SCORE METADATA
          # =====================================================

          scored = []


          for candidate in candidates.values():

              title_score = text_similarity(
                  title_query,
                  candidate["title"]
              )


              description_score = text_similarity(
                  description,
                  candidate["description"]
              )


              combined = (
                  title_score * 0.70
                  + description_score * 0.30
              )


              candidate["title_score"] = float(
                  title_score
              )

              candidate["description_score"] = float(
                  description_score
              )

              candidate["metadata_score"] = float(
                  combined
              )

              candidate_duration = float(candidate.get("duration", 0.0))
              if duration > 0 and candidate_duration > 0:
                  duration_score = min(candidate_duration, duration) / max(candidate_duration, duration)
              else:
                  duration_score = 0.0
              candidate["duration_score"] = float(duration_score)


              scored.append(
                  candidate
              )


          scored.sort(
              key=lambda x: x["metadata_score"],
              reverse=True
          )


          # =====================================================
          # THUMBNAIL PHASH
          # =====================================================

          def thumbnail_similarity(
              source_hash,
              url
          ):

              if not url:
                  return 0.0


              try:

                  response = requests.get(
                      url,
                      timeout=15
                  )

                  if response.status_code != 200:
                      return 0.0


                  with Image.open(
                      __import__(
                          "io"
                      ).BytesIO(
                          response.content
                      )
                  ) as image:

                      image = image.convert(
                          "RGB"
                      )

                      target_hash = imagehash.phash(
                          image
                      )


                  distance = int(
                      source_hash
                      - target_hash
                  )

                  similarity = max(
                      0.0,
                      1.0
                      - (
                          distance / 64.0
                      )
                  )

                  return float(
                      similarity
                  )

              except Exception:

                  return 0.0


          # =====================================================
          # OPTIONAL VIDEO CONTENT CHECK
          # =====================================================

          def download_candidate(
              video_id,
              destination
          ):

              url = (
                  "https://www.youtube.com/watch?v="
                  + video_id
              )


              command = [
                  "yt-dlp",

                  "--no-playlist",

                  "--quiet",

                  "--no-warnings",

                  "--max-filesize",
                  "80M",

                  "-f",
                  "bv*[height<=360]+ba/"
                  "b[height<=360]/b",

                  "--merge-output-format",
                  "mp4",

                  "-o",
                  destination,

                  url
              ]


              try:

                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=90
                  )

                  return (
                      result.returncode == 0
                      and os.path.exists(
                          destination
                      )
                  )

              except Exception:

                  return False


          def content_similarity(
              source_hashes,
              candidate_video
          ):

              if not source_hashes:
                  return 0.0


              target_hashes = get_video_hashes(
                  candidate_video
              )


              if not target_hashes:
                  return 0.0


              similarities = []


              for source_hash in source_hashes:

                  best = 0.0

                  for target_hash in target_hashes:

                      distance = int(
                          source_hash
                          - target_hash
                      )

                      similarity = max(
                          0.0,
                          1.0
                          - (
                              distance / 64.0
                          )
                      )

                      best = max(
                          best,
                          float(similarity)
                      )


                  similarities.append(
                      best
                  )


              return float(
                  sum(similarities)
                  / len(similarities)
              )


          # =====================================================
          # VISUAL + CONTENT CHECK
          # =====================================================

          # IMPORTANT: Do NOT restrict video downloads to metadata-only
          # candidates. The same reel can have a completely different
          # YouTube title/description. First rank by BOTH metadata and
          # thumbnail similarity, then download the strongest visual
          # candidates and compare actual video frames.

          temp_dir = tempfile.mkdtemp(
              prefix="youtube_candidates_"
          )


          try:

              # Calculate thumbnail similarity for ALL discovered candidates.
              # This is the key fix for videos whose YouTube metadata differs
              # from the Instagram metadata.
              for candidate in candidates.values():

                  thumbnail_score = 0.0

                  if source_hashes and candidate.get("thumbnail"):

                      scores = []

                      for source_hash in source_hashes:
                          scores.append(
                              thumbnail_similarity(
                                  source_hash,
                                  candidate["thumbnail"]
                              )
                          )

                      thumbnail_score = max(scores) if scores else 0.0

                  candidate["thumbnail_score"] = float(thumbnail_score)

                  metadata_score = float(candidate.get("metadata_score", 0.0))

                  # Visual-first ranking. A low metadata score must NOT hide
                  # a visually identical YouTube upload.
                  duration_score = float(candidate.get("duration_score", 0.0))
                  candidate["discovery_score"] = float(
                      max(
                          thumbnail_score,
                          metadata_score * 0.50
                          + thumbnail_score * 0.35
                          + duration_score * 0.15
                      )
                  )


              discovery_candidates = sorted(
                  candidates.values(),
                  key=lambda x: x["discovery_score"],
                  reverse=True
              )

              print()
              print(
                  f"Visual discovery candidates: {len(discovery_candidates)}"
              )

              # Download more candidates than before. The exact duplicate may
              # have weak/zero metadata similarity.
              DOWNLOAD_LIMIT = min(50, len(discovery_candidates))

              final_candidates = []

              for candidate in discovery_candidates[:DOWNLOAD_LIMIT]:

                  video_path = os.path.join(
                      temp_dir,
                      candidate["video_id"] + ".mp4"
                  )

                  # Download candidates with either useful metadata or a
                  # useful visual signal. This avoids wasting downloads on
                  # unrelated search results.
                  should_download = (
                      candidate["thumbnail_score"] >= 0.52
                      or candidate["metadata_score"] >= 0.28
                      or candidate["discovery_score"] >= 0.48
                      or candidate.get("duration_score", 0.0) >= 0.96
                  )

                  if should_download and download_candidate(
                      candidate["video_id"],
                      video_path
                  ):

                      candidate["content_score"] = float(
                          content_similarity(
                              source_hashes,
                              video_path
                          )
                      )

                  else:

                      candidate["content_score"] = 0.0


                  metadata_score = float(candidate["metadata_score"])
                  thumbnail_score = float(candidate["thumbnail_score"])
                  content_score = float(candidate["content_score"])

                  # Actual frame similarity gets the highest weight.
                  duration_score = float(candidate.get("duration_score", 0.0))
                  final_score = (
                      metadata_score * 0.15
                      + thumbnail_score * 0.20
                      + content_score * 0.55
                      + duration_score * 0.10
                  )

                  candidate["final_score"] = float(final_score)
                  final_candidates.append(candidate)


          finally:

              shutil.rmtree(
                  temp_dir,
                  ignore_errors=True
              )


          final_candidates.sort(
              key=lambda x: x["final_score"],
              reverse=True
          )


          # =====================================================
          # DUPLICATE DECISION
          # =====================================================

          duplicate = False
          duplicate_candidate = None


          for candidate in final_candidates:

              metadata_score = float(candidate["metadata_score"])
              content_score = float(candidate["content_score"])
              thumbnail_score = float(candidate["thumbnail_score"])

              # VERY STRONG: actual video frames match.
              if content_score >= 0.82:
                  duplicate = True
                  duplicate_candidate = candidate
                  break

              # Strong visual + reasonable metadata.
              if (
                  content_score >= 0.70
                  and thumbnail_score >= 0.70
              ):
                  duplicate = True
                  duplicate_candidate = candidate
                  break

              # Same video can have a different title, so allow a strong
              # thumbnail/content combination without title similarity.
              if (
                  content_score >= 0.65
                  and thumbnail_score >= 0.82
              ):
                  duplicate = True
                  duplicate_candidate = candidate
                  break

              # Metadata-only fallback. Kept intentionally conservative.
              if (
                  content_score == 0
                  and metadata_score >= 0.92
                  and thumbnail_score >= 0.88
              ):
                  duplicate = True
                  duplicate_candidate = candidate
                  break


          # =====================================================
          # RESULT
          # =====================================================

          import hashlib

          with open(VIDEO_FILE, "rb") as vf:
              source_sha256 = hashlib.sha256(vf.read()).hexdigest()

          result = {
              "duplicate": bool(duplicate),
              "source": {
                  "title": str(title),
                  "duration": float(duration),
                  "width": int(width),
                  "height": int(height),
                  "sha256": source_sha256,
                  "phash_frames": [str(h) for h in source_hashes]
              },
              "candidate_count": int(
                  len(candidates)
              ),
              "queries": [
                  str(x)
                  for x in queries
              ],
              "best_match": None,
              "top_candidates": []
          }


          if duplicate_candidate:

              result[
                  "best_match"
              ] = {
                  "video_id": str(
                      duplicate_candidate[
                          "video_id"
                      ]
                  ),
                  "url": (
                      "https://www.youtube.com/watch?v="
                      + str(
                          duplicate_candidate[
                              "video_id"
                          ]
                      )
                  ),
                  "title": str(
                      duplicate_candidate[
                          "title"
                      ]
                  ),
                  "channel": str(
                      duplicate_candidate[
                          "channel_title"
                      ]
                  ),
                  "metadata_score": float(
                      duplicate_candidate[
                          "metadata_score"
                      ]
                  ),
                  "thumbnail_score": float(
                      duplicate_candidate[
                          "thumbnail_score"
                      ]
                  ),
                  "content_score": float(
                      duplicate_candidate[
                          "content_score"
                      ]
                  ),
                  "duration_score": float(
                      duplicate_candidate.get("duration_score", 0.0)
                  ),
                  "final_score": float(
                      duplicate_candidate[
                          "final_score"
                      ]
                  )
              }


          # Keep top 10 for debugging.
          for candidate in final_candidates[:10]:

              result[
                  "top_candidates"
              ].append(
                  {
                      "video_id": str(
                          candidate[
                              "video_id"
                          ]
                      ),
                      "title": str(
                          candidate[
                              "title"
                          ]
                      ),
                      "channel": str(
                          candidate[
                              "channel_title"
                          ]
                      ),
                      "metadata_score": float(
                          candidate[
                              "metadata_score"
                          ]
                      ),
                      "thumbnail_score": float(
                          candidate[
                              "thumbnail_score"
                          ]
                      ),
                      "content_score": float(
                          candidate[
                              "content_score"
                          ]
                      ),
                      "duration_score": float(
                          candidate.get("duration_score", 0.0)
                      ),
                      "final_score": float(
                          candidate[
                              "final_score"
                          ]
                      )
                  }
              )


          # IMPORTANT:
          # Convert any numpy scalar values to native Python values
          # before json.dump (prevents int64/float64 serialization errors).
          def json_safe(value):
              if isinstance(value, dict):
                  return {str(k): json_safe(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [json_safe(v) for v in value]
              if hasattr(value, "item"):
                  try:
                      return value.item()
                  except Exception:
                      pass
              return value

          result = json_safe(result)

          with open(
              "duplicate_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("========================================")
          print("DUPLICATE RESULT")
          print("========================================")

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              )
          )


          if duplicate:

              print()
              print(
                  "🚫 DUPLICATE DETECTED"
              )

              if duplicate_candidate:

                  print(
                      "YouTube URL:"
                  )

                  print(
                      "https://www.youtube.com/watch?v="
                      + duplicate_candidate[
                          "video_id"
                      ]
                  )

                  print(
                      "Title:"
                  )

                  print(
                      duplicate_candidate[
                          "title"
                      ]
                  )

              # GitHub Actions output.
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:

                  f.write(
                      "duplicate=true\n"
                  )

          else:

              print()
              print(
                  "✅ NO STRONG DUPLICATE FOUND"
              )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:

                  f.write(
                      "duplicate=false\n"
                  )

          PY

          python3 youtube_duplicate_check.py


      # =========================================================
      # 13. CHECK DUPLICATE RESULT
      # =========================================================
      - name: Check duplicate result
        run: |

          echo "========================================"
          echo "DUPLICATE DECISION"
          echo "========================================"

          cat duplicate_result.json

          echo ""
          echo "========================================"

          if [ "${{ steps.duplicate.outputs.duplicate }}" = "true" ]; then

            echo "🚫 DUPLICATE FOUND."
            echo "Instagram Reel will NOT be uploaded."
            echo "Workflow will stop safely."

            exit 0

          else

            echo "✅ NO STRONG DUPLICATE FOUND."
            echo "Proceeding to YouTube upload."

          fi


      # =========================================================
      # 14. PREPARE YOUTUBE OAUTH
      # =========================================================
      - name: Prepare YouTube OAuth credentials
        if: steps.duplicate.outputs.duplicate != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          echo "========================================"
          echo "PREPARING YOUTUBE OAUTH"
          echo "========================================"

          if [ -z "$YOUTUBE_CLIENT_ID" ]; then
            echo "ERROR: YOUTUBE_CLIENT_ID is missing."
            exit 1
          fi

          if [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "ERROR: YOUTUBE_CLIENT_SECRET is missing."
            exit 1
          fi

          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "ERROR: YOUTUBE_REFRESH_TOKEN is missing."
            exit 1
          fi

          echo "YouTube OAuth secrets are configured."


      # =========================================================
      # 15. UPLOAD TO YOUTUBE
      # =========================================================
      - name: Upload Short to YouTube
        if: steps.duplicate.outputs.duplicate != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          import json
          import re
          import unicodedata

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          CLIENT_ID = os.environ.get("YOUTUBE_CLIENT_ID")
          CLIENT_SECRET = os.environ.get("YOUTUBE_CLIENT_SECRET")
          REFRESH_TOKEN = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not CLIENT_ID:
              raise RuntimeError("YOUTUBE_CLIENT_ID is missing.")
          if not CLIENT_SECRET:
              raise RuntimeError("YOUTUBE_CLIENT_SECRET is missing.")
          if not REFRESH_TOKEN:
              raise RuntimeError("YOUTUBE_REFRESH_TOKEN is missing.")

          with open("metadata.json", "r", encoding="utf-8") as f:
              metadata = json.load(f)

          title = str(metadata.get("title", "Instagram Reel #Shorts")).strip()
          description = str(metadata.get("description", "")).strip()
          hashtags = str(metadata.get("hashtags", "")).strip()
          raw_tags = str(metadata.get("tags", ""))

          def clean_tag(value):
              value = unicodedata.normalize("NFKC", str(value))
              value = re.sub(r"https?://\S+|www\.\S+", " ", value, flags=re.I)
              value = value.replace("#", " ")
              value = "".join(
                  ch for ch in value
                  if unicodedata.category(ch) not in ("Cc", "Cf")
              )
              value = re.sub(r"\s+", " ", value).strip()
              value = value.replace(",", " ")
              return value.strip()

          parsed_tags = []
          for item in raw_tags.split(","):
              tag = clean_tag(item)
              if not tag:
                  continue
              if len(tag) > 80:
                  tag = tag[:80].rstrip()
              if not any(tag.casefold() == old.casefold() for old in parsed_tags):
                  parsed_tags.append(tag)

          # Keep a safety margin below YouTube's total keyword limit.
          final_tags = []
          total_chars = 0
          MAX_TAG_CHARS = 450

          for tag in parsed_tags:
              addition = len(tag) if not final_tags else len(tag) + 1
              if total_chars + addition > MAX_TAG_CHARS:
                  break
              final_tags.append(tag)
              total_chars += addition

          final_tags = [
              tag for tag in final_tags
              if tag and len(tag) <= 80 and "\n" not in tag and "\r" not in tag
          ]

          final_description = (description + "\n\n" + hashtags).strip()

          print("========================================")
          print("YOUTUBE SEO PAYLOAD")
          print("========================================")
          print("Title characters:", len(title))
          print("Description characters:", len(final_description))
          print("SEO tag count:", len(final_tags))
          print("SEO tag characters:", len(", ".join(final_tags)))
          print("SEO tags:", ", ".join(final_tags))
          print("========================================")

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          print("Refreshing YouTube OAuth...")
          credentials.refresh(Request())

          youtube = build("youtube", "v3", credentials=credentials)

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": final_description[:5000],
                  "tags": final_tags,
                  "categoryId": "10"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/youtube_short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          def upload_video(upload_body):
              request = youtube.videos().insert(
                  part="snippet,status",
                  body=upload_body,
                  media_body=media
              )
              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print("Upload progress:", int(status.progress() * 100), "%")
              return response

          print("========================================")
          print("UPLOADING TO YOUTUBE")
          print("========================================")
          print("Title:", title)

          try:
              response = upload_video(body)

          except HttpError as error:
              error_text = str(error)
              print("YouTube API error:", error_text)

              # If YouTube rejects the keyword field, retry once without tags.
              if getattr(error.resp, "status", None) == 400 and "invalidTags" in error_text:
                  print("YouTube rejected SEO tags.")
                  print("Retrying safely WITHOUT tags...")

                  retry_body = {
                      "snippet": {
                          "title": title[:100],
                          "description": final_description[:5000],
                          "categoryId": "10"
                      },
                      "status": {
                          "privacyStatus": "public",
                          "selfDeclaredMadeForKids": False
                      }
                  }

                  media = MediaFileUpload(
                      "output/youtube_short.mp4",
                      mimetype="video/mp4",
                      resumable=True
                  )
                  response = upload_video(retry_body)
                  print("Fallback upload succeeded.")
              else:
                  raise

          video_id = response.get("id")
          if not video_id:
              raise RuntimeError("YouTube upload did not return a video ID.")

          result = {
              "video_id": str(video_id),
              "url": "https://www.youtube.com/watch?v=" + str(video_id),
              "title": str(title),
              "seo_tag_count": len(final_tags),
              "seo_tag_characters": len(", ".join(final_tags))
          }

          with open("youtube_upload_result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("========================================")
          print("UPLOAD SUCCESSFUL")
          print("========================================")
          print("Video URL:", result["url"])
          PY

          python3 upload_youtube.py

      # =========================================================
      # 16. CHECK YOUTUBE UPLOAD
      # =========================================================
      - name: Check YouTube upload result
        if: steps.duplicate.outputs.duplicate != 'true'
        run: |

          echo "========================================"
          echo "YOUTUBE UPLOAD RESULT"
          echo "========================================"

          cat youtube_upload_result.json


      # =========================================================
      # 17. SAVE OUTPUTS
